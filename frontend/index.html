<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sanjeevani Grid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <style>
      /* first paint, before the app's code arrives; React replaces it on mount */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f6f8f7; font: 600 18px "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f2a28; }
      .boot i { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: #115e59; color: #f6f8f7; font-style: normal; font-size: 26px; font-weight: 700; animation: boot 1.6s ease-in-out infinite; }
      @keyframes boot { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(17, 94, 89, .35); } 50% { transform: scale(1.04); box-shadow: 0 0 0 14px rgba(17, 94, 89, 0); } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-label="Loading Sanjeevani Grid" role="status"><i>S</i><span>Sanjeevani Grid</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
