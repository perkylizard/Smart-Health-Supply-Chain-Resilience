[project]
name = "sanjeevani"
version = "0.1.0"
description = "Sanjeevani Grid: federated AI for PHC medicine stock resilience (Hack2Skill x Google BRICS, Track 3)"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "pyarrow>=17", "duckdb>=1.1", "requests>=2.32", "numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sanjeevani"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
