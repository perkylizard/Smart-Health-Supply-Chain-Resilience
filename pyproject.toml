[project]
name = "sanjeevani"
version = "0.1.0"
description = "Sanjeevani Grid: federated AI for PHC medicine stock resilience (Hack2Skill x Google BRICS, Track 3)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "requests>=2.32",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "ortools>=9.15.6755",
    "pydantic>=2.13.5",
    "google-genai>=2.22.0",
    "google-cloud-bigquery>=3.45.0",
    "db-dtypes>=1.7.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sanjeevani"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
